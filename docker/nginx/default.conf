server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 64M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Docker Compose service hostnames (app, reverb) are only registered in
    # the embedded DNS (127.0.0.11) once those containers are actually up.
    # A plain `proxy_pass http://app:9000` / `fastcgi_pass app:9000` resolves
    # at config-load time — if that service isn't up yet (a restart, a crash
    # loop on a container nginx doesn't even need for most requests), nginx
    # refuses to start AT ALL and the whole site 502s, not just the one
    # dependent route. Resolving through a variable defers that lookup to
    # request time instead, so nginx itself stays up regardless — a single
    # dependent container being down only 502s the requests that actually
    # need it.
    resolver 127.0.0.11 valid=10s;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Reverb's websocket endpoint — proxied on the same host/port as the rest
    # of the site so it works identically over the LAN IP and (later) the
    # Cloudflare Tunnel domain, without a separate exposed port.
    location /app/ {
        set $reverb_upstream reverb:8080;
        proxy_pass http://$reverb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ~ \.php$ {
        set $app_upstream app:9000;
        fastcgi_pass $app_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
