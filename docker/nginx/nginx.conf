# Menggantikan nginx.conf bawaan image nginx:alpine. Bedanya: batas koneksi dinaikkan.
# Tiap penonton /live memegang 1 websocket (klien↔nginx) + 1 koneksi ke Reverb (nginx↔reverb),
# jadi bawaan 1024 koneksi/worker hanya cukup ± 500 penonton.
user  nginx;
worker_processes  auto;
worker_rlimit_nofile  65535;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  8192;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log  /var/log/nginx/access.log  main;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout  65;

    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
