; Default php:8.3-fpm-alpine ships with upload_max_filesize=2M, post_max_size=8M —
; too small for avatar/proof-video/banner uploads (Livewire's own temp-upload
; rule already allows up to 12M). Raise both so PHP doesn't silently drop the
; file before Laravel ever sees it.
upload_max_filesize = 20M
post_max_size = 25M
