; Kode PHP di-cache di memori — request Livewire lebih ringan. Revalidasi tiap 30 detik
; supaya view Blade hasil kompilasi ulang tetap terbaca tanpa restart.
opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 30
