; Pool php-fpm untuk /live yang dibuka banyak penonton sekaligus.
; Default image alpine hanya max_children = 5 → request Livewire penonton antre dan layar telat.
; Tiap worker ± 40–60 MB RAM: 30 worker ≈ 1.5–2 GB. Turunkan kalau RAM server kecil.
[www]
pm = dynamic
pm.max_children = 30
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 12
pm.max_requests = 500
